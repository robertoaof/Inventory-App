<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem de Óleo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151A;
    --panel:#1A1F26;
    --panel-2:#20262E;
    --border:#2A323C;
    --text:#E8EAED;
    --text-muted:#8A93A0;
    --amber:#E8A33D;
    --amber-dim:#4A3A20;
    --blue:#4C8FD6;
    --blue-dim:#1F3350;
    --red:#E2574C;
    --red-dim:#4A2320;
    --green:#43C08A;
    --green-dim:#1B3C30;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding:24px 16px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:16px;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
  }
  .brand-row{display:flex;align-items:center;gap:14px;}
  .brand-logo{height:38px;width:auto;object-fit:contain;background:#F1F1F1;border-radius:6px;padding:3px 5px;box-sizing:content-box;}
  .brand{display:flex;flex-direction:column;gap:4px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:2px;
    color:var(--amber);
    text-transform:uppercase;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .date-row{display:flex;align-items:center;gap:10px;}
  .date-row label{font-size:12px;color:var(--text-muted);}
  input[type="date"]{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .save-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
    min-height:14px;
    text-align:right;
  }
  .editing-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--amber-dim);
    color:var(--amber);
    border:1px solid var(--amber);
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:13px;
    margin-bottom:20px;
  }
  .editing-banner.show{display:flex;}
  .editing-banner a{color:var(--amber);cursor:pointer;text-decoration:underline;font-size:12px;}
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:24px;
    border-bottom:1px solid var(--border);
  }
  .tab-btn{
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--text-muted);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:10px 4px;
    cursor:pointer;
    border-radius:0;
  }
  .tab-btn:hover{border-color:var(--border);color:var(--text);}
  .tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-bottom:28px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat .n{
    font-family:'Oswald',sans-serif;
    font-size:30px;
    font-weight:600;
  }
  .stat .l{
    font-size:12px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .stat.falta .n{color:var(--red);}
  .stat.sobra .n{color:var(--blue);}
  .stat.correto .n{color:var(--green);}
  section{margin-bottom:32px;}
  .sec-title{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .sec-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border);
  }
  .row{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:8px;
  }
  .row-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    gap:8px;
  }
  .row-name{font-weight:500;font-size:14px;}
  .row-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
  }
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    padding:3px 10px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    white-space:nowrap;
  }
  .badge.falta{background:var(--red-dim);color:var(--red);}
  .badge.sobra{background:var(--blue-dim);color:var(--blue);}
  .badge.correto{background:var(--green-dim);color:var(--green);}
  .fields{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
    gap:10px;
    margin-bottom:10px;
  }
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{
    font-size:10px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .field input[type="number"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    width:100%;
  }
  .field input[type="number"]:focus{outline:1px solid var(--amber);border-color:var(--amber);}
  .field.computed .val{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    padding:8px;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:6px;
  }
  .field.diff .val{font-weight:600;}
  .bar{
    height:6px;
    background:var(--panel-2);
    border-radius:4px;
    overflow:hidden;
    display:flex;
    margin-bottom:8px;
  }
  .bar-seg{height:100%;}
  .bar-fis{background:var(--amber);}
  .bar-sis{background:var(--blue);}
  .bar-legend{
    display:flex;
    gap:14px;
    font-size:11px;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .bar-legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.fis{background:var(--amber);}
  .dot.sis{background:var(--blue);}
  .obs-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:7px 9px;
    font-size:12px;
    font-family:'Inter',sans-serif;
  }
  .obs-input::placeholder{color:var(--text-muted);}
  .footer-actions{
    display:flex;
    gap:10px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
  }
  button:hover{border-color:var(--amber);}
  button.primary{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
  button.reset{color:var(--red);}
  .hist-list{display:flex;flex-direction:column;gap:8px;}
  .hist-row{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .hist-date{
    font-family:'Oswald',sans-serif;
    font-size:16px;
    font-weight:600;
    min-width:110px;
  }
  .hist-counts{
    display:flex;
    gap:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .hist-counts .falta{color:var(--red);}
  .hist-counts .sobra{color:var(--blue);}
  .hist-counts .correto{color:var(--green);}
  .empty-state{
    color:var(--text-muted);
    font-size:13px;
    padding:24px;
    text-align:center;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    max-width:360px;
    width:100%;
  }
  .modal-box p{margin:0 0 18px;font-size:14px;line-height:1.5;color:var(--text);}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end;}
  .import-row{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:20px;
  }
  .import-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
  }
  .search-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:9px 12px;
    font-size:13px;
    margin-bottom:16px;
  }
  .search-input::placeholder{color:var(--text-muted);}
  .plist{display:flex;flex-direction:column;gap:6px;}
  .prow{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px 18px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 14px;
  }
  .p-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
    min-width:78px;
  }
  .p-desc{flex:1 1 200px;font-size:13px;line-height:1.4;}
  .p-loc{display:block;font-size:10px;color:var(--text-muted);margin-top:2px;}
  .p-field{display:flex;flex-direction:column;gap:3px;min-width:66px;}
  .p-field label{
    font-size:9px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .p-static{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:6px 0;
  }
  .p-field input[type="number"]{
    width:70px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:6px 8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .p-field input[type="number"]:focus{outline:1px solid var(--amber);border-color:var(--amber);}
  .p-diff{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;padding:6px 0;}
  .print-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;justify-content:flex-end;}
  .print-row button{font-size:12px;padding:8px 12px;}
  #area-impressao{display:none;}

  @media print{
    body *{visibility:hidden;}
    #area-impressao, #area-impressao *{visibility:visible;}
    #area-impressao{
      display:block !important;
      position:absolute;
      left:0;
      top:0;
      width:100%;
      background:#fff;
      color:#000;
      font-family:Arial,Helvetica,sans-serif;
      padding:0;
    }
    .modal-overlay{display:none !important;}
    .imp-header{text-align:center;margin-bottom:14px;border-bottom:2px solid #000;padding-bottom:8px;}
    .imp-empresa{font-size:16px;font-weight:bold;text-transform:uppercase;}
    .imp-titulo{font-size:13px;margin-top:4px;}
    .imp-meta{font-size:10px;color:#333;margin-top:4px;}
    .imp-secao-titulo{font-size:13px;font-weight:bold;text-transform:uppercase;margin:16px 0 6px;border-bottom:1px solid #000;padding-bottom:3px;}
    table.imp-tabela{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:6px;}
    table.imp-tabela th, table.imp-tabela td{border:1px solid #999;padding:3px 5px;text-align:left;}
    table.imp-tabela th{background:#eee;}
    @page{size:A4;margin:12mm;}
  }
</style>
</head>

  return `${d}/${m}/${y}`;
}

function formatDiffImpressao(diff){
  return diff>0 ? `+${diff}` : `${diff}`;
}
function statusLabelImpressao(status){
  if(status==='correto') return 'CORRETO';
  if(status==='sobra') return 'SOBRA ▲';
  return 'FALTA ▼';
}

function fisicoOfItems(items, code){
  const it = items[code];
  return 'estoque' in it ? (Number(it.estoque)||0)+(Number(it.oficina)||0) : (Number(it.fisico)||0);
}
function diffOfItems(items, code){
  const it = items[code];
  return fisicoOfItems(items, code) - (Number(it.sistema)||0);
}
function statusOfItems(items, code){
  const d = diffOfItems(items, code);
  if(d===0) return 'correto';
  return d>0 ? 'sobra' : 'falta';
}
function summarizeItems(items, codes){
  let falta=0, sobra=0, correto=0;
  codes.forEach(code=>{
    const s = statusOfItems(items, code);
    if(s==='falta') falta++; else if(s==='sobra') sobra++; else correto++;
  });
  return {falta, sobra, correto};
}
function summarize(items){
  return summarizeItems(items, ALL_ITEMS.map(i=>i.code));
}

function fisicoOf(code){ return fisicoOfItems(state.items, code); }
function diffOf(code){ return diffOfItems(state.items, code); }
function statusOf(code){ return statusOfItems(state.items, code); }

function parseXMLDados(texto){
  const parser = new DOMParser();
  const doc = parser.parseFromString(texto, 'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('XML inválido');
  return Array.from(doc.getElementsByTagName('Dados'));
}

function extrairItensXML(elementos){
  return elementos.map(el=>{
    const codigo = (el.getAttribute('Coluna6')||'').trim();
    const descricao = (el.getAttribute('Coluna7')||'').trim();
    const unidade = (el.getAttribute('Coluna4')||'').trim();
    const localizacao = (el.getAttribute('Coluna1')||'').trim();
    const sistemaRaw = (el.getAttribute('Coluna2')||'').trim();
    const sistema = sistemaRaw==='' ? 0 : (parseInt(sistemaRaw,10)||0);
    return {codigo, descricao, unidade, localizacao, sistema};
  }).filter(it=>it.codigo);
}

function detectarCodigosDuplicados(itens){
  const vistos = new Set();
  const duplicados = new Set();
  itens.forEach(it=>{
    if(vistos.has(it.codigo)) duplicados.add(it.codigo);
    vistos.add(it.codigo);
  });
  return Array.from(duplicados);
}

function separarConhecidosENovos(itens){
  const codigosConhecidos = new Set(ALL_ITEMS.map(i=>i.code));
  const conhecidos = [];
  const novos = [];
  itens.forEach(it=>{
    if(codigosConhecidos.has(it.codigo)) conhecidos.push(it);
    else novos.push(it);
  });
  return {conhecidos, novos};
}

function aplicarNaContagem(itensConhecidos){
  let atualizados = 0;
  itensConhecidos.forEach(it=>{
    if(state.items[it.codigo]){
      state.items[it.codigo].sistema = it.sistema;
      atualizados++;
    }
  });
  return atualizados;
}

function atualizarInventarios(itensNovos){
  let novosCount = 0, atualizadosCount = 0;
  itensNovos.forEach(it=>{
    const existente = statePecas.items[it.codigo];
    if(existente){
      existente.descricao = it.descricao;
      existente.unidade = it.unidade;
      existente.localizacao = it.localizacao;
      existente.sistema = it.sistema;
      atualizadosCount++;
    } else {
      statePecas.items[it.codigo] = {
        descricao: it.descricao,
        unidade: it.unidade,
        localizacao: it.localizacao,
        sistema: it.sistema,
        fisico: 0,
        obs: ''
      };
      novosCount++;
    }
  });
  return {novosCount, atualizadosCount};
}

function render(){
  document.getElementById('oleos-list').innerHTML = OLEOS.map(i=>rowTemplate(i,false)).join('');
  document.getElementById('graxas-list').innerHTML = GRAXAS.map(i=>rowTemplate(i,true)).join('');

  ALL_ITEMS.forEach(item=>{
    const c = item.code;
    const isGraxa = !('estoque' in state.items[c]);
    if(!isGraxa){
      document.getElementById(`est-${c}`).addEventListener('input', e=>{state.items[c].estoque=e.target.value===''?0:Number(e.target.value); recalcRow(c); scheduleDraftSave();});
      document.getElementById(`ofi-${c}`).addEventListener('input', e=>{state.items[c].oficina=e.target.value===''?0:Number(e.target.value); recalcRow(c); scheduleDraftSave();});
    } else {
      document.getElementById(`fis-${c}`).addEventListener('input', e=>{state.items[c].fisico=e.target.value===''?0:Number(e.target.value); recalcRow(c); scheduleDraftSave();});
    }
    document.getElementById(`sis-${c}`).addEventListener('input', e=>{state.items[c].sistema=e.target.value===''?0:Number(e.target.value); recalcRow(c); scheduleDraftSave();});
    document.getElementById(`obs-${c}`).addEventListener('input', e=>{state.items[c].obs=e.target.value; scheduleDraftSave();});
    recalcRow(c, true);
  });
  updateSummary();
  updateEditingBanner();
}

function recalcRow(code, skipSummary){
  const fis = fisicoOf(code);
  const diff = diffOf(code);
  const status = statusOf(code);
  const it = state.items[code];

  if('estoque' in it){
    document.getElementById(`tot-${code}`).textContent = fis;
  }
  const diffEl = document.getElementById(`diff-${code}`);
  diffEl.textContent = diff>0 ? `+${diff}` : diff;
  diffEl.style.color = status==='correto' ? 'var(--green)' : status==='sobra' ? 'var(--blue)' : 'var(--red)';

  const badge = document.getElementById(`badge-${code}`);
  badge.className = 'badge '+status;
  badge.textContent = status==='correto' ? 'Correto' : status==='sobra' ? 'Sobra' : 'Falta';

  const maxVal = Math.max(fis, Number(it.sistema)||0, 1);
  document.getElementById(`bar-fis-${code}`).style.width = (fis/maxVal*100)+'%';
  document.getElementById(`bar-sis-${code}`).style.width = ((Number(it.sistema)||0)/maxVal*100)+'%';

  if(!skipSummary) updateSummary();
}

function updateSummary(){
  const s = summarize(state.items);
  document.getElementById('cnt-falta').textContent = s.falta;
  document.getElementById('cnt-sobra').textContent = s.sobra;
  document.getElementById('cnt-correto').textContent = s.correto;
}

      const now = new Date();
      statusEl.textContent = 'Rascunho salvo às '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    }catch(err){
      statusEl.textContent = 'Não foi possível salvar o rascunho';
    }

}

let pecasDraftTimer = null;
function schedulePecasDraftSave(){

    try{
      await window.storage.set(PECAS_DRAFT_KEY, JSON.stringify(statePecas), false);
    }catch(err){
      document.getElementById('import-status').textContent = 'Não foi possível salvar o rascunho de peças';

async function salvarContagemDoDia(){
  const date = document.getElementById('data-contagem').value;
  if(!date){ await customAlert('Escolha uma data antes de salvar.'); return; }
  const key = HISTORY_PREFIX + date;

  if(!state.savedKey || state.savedKey !== key){
    let exists = null;
    try{ exists = await window.storage.get(key, false); }catch(err){ exists = null; }
    if(exists && exists.value){
      const ok = await customConfirm(`Já existe uma contagem salva para ${formatDateBR(date)}. Substituir?`);
      if(!ok) return;
    }
  } else {
    const ok = await customConfirm(`Atualizar a contagem salva de ${formatDateBR(date)}?`);
    if(!ok) return;
  }

  state.date = date;
  const toSave = {date: state.date, oleos: state.items, pecas: statePecas.items};
  try{
    await window.storage.set(key, JSON.stringify(toSave), false);
    state.savedKey = key;
    await window.storage.delete(DRAFT_KEY, false).catch(()=>{});
    await window.storage.delete(PECAS_DRAFT_KEY, false).catch(()=>{});
    document.getElementById('save-status').textContent = 'Contagem do dia salva';
    updateEditingBanner();
  }catch(err){
    await customAlert('Não foi possível salvar a contagem. Tente novamente.');
  }
}
document.getElementById('btn-salvar-dia').addEventListener('click', salvarContagemDoDia);
document.getElementById('btn-salvar-dia-pecas').addEventListener('click', salvarContagemDoDia);

async function novaContagem(){

  if(!ok) return;
  ALL_ITEMS.forEach(item=>{
    const it = state.items[item.code];
    if('estoque' in it){
      it.estoque = 0;
      it.oficina = 0;

  document.getElementById('data-contagem').value = state.date;
  render();
  renderInventarios();
  scheduleDraftSave();
  schedulePecasDraftSave();
}

document.getElementById('xml-file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('import-status');
  statusEl.textContent = 'Lendo arquivo...';
  try{
    const texto = await file.text();
    const elementos = parseXMLDados(texto);
    const itens = extrairItensXML(elementos);
    if(itens.length===0){
      await customAlert('Não encontrei itens nesse XML. Verifique se é o arquivo de conferência correto.');
      statusEl.textContent = '';
      e.target.value = '';
      return;
    }
    const duplicados = detectarCodigosDuplicados(itens);
    const {conhecidos, novos} = separarConhecidosENovos(itens);
    const qtdConhecidos = aplicarNaContagem(conhecidos);
    const {novosCount, atualizadosCount} = atualizarInventarios(novos);

    render();
    renderInventarios();
    scheduleDraftSave();
    schedulePecasDraftSave();

    let msg = `Importação concluída: ${qtdConhecidos} óleo(s)/graxa(s) tiveram a quantidade de sistema atualizada na aba Contagem. `
      + `${novosCount} item(ns) novo(s) adicionado(s) e ${atualizadosCount} atualizado(s) na aba Inventários.`;
    if(duplicados.length>0){
      msg += ` Atenção: o(s) código(s) ${duplicados.join(', ')} apareceu(ram) mais de uma vez no XML — foi usado o último valor de cada.`;
    }
    statusEl.textContent = `Último import: ${file.name}`;
    await customAlert(msg);
  }catch(err){
    statusEl.textContent = '';
    await customAlert('Não foi possível ler esse arquivo XML. Verifique se o arquivo é válido.');
  }
  e.target.value = '';
});

async function loadHistoricoList(){
  const container = document.getElementById('historico-list');
  container.innerHTML = '<div class="empty-state">Carregando...</div>';
  let keys = [];
  try{
    const res = await window.storage.list(HISTORY_PREFIX, false);
    keys = (res && res.keys) ? res.keys : [];
  }catch(err){
    keys = [];
  }
  if(keys.length===0){
    container.innerHTML = '<div class="empty-state">Nenhuma contagem salva ainda. Salve a contagem do dia na aba Contagem.</div>';
    return;
  }
  keys.sort().reverse();
  const entries = await Promise.all(keys.map(async k=>{
    try{
      const res = await window.storage.get(k, false);
      const data = JSON.parse(res.value);
      const oleosItems = data.oleos || data.items || {};
      const pecasItems = data.pecas || {};
      const sOleos = summarize(oleosItems);
      const sPecas = summarizeItems(pecasItems, Object.keys(pecasItems));
      const combinado = {
        falta: sOleos.falta + sPecas.falta,
        sobra: sOleos.sobra + sPecas.sobra,
        correto: sOleos.correto + sPecas.correto
      };
      return {key:k, date:data.date, summary: combinado, pecasCount: Object.keys(pecasItems).length};
    }catch(err){
      return null;
    }
  }));
  container.innerHTML = entries.filter(Boolean).map(e=>`
    <div class="hist-row">
      <div class="hist-date">${formatDateBR(e.date)}</div>
      <div class="hist-counts">
        <span class="falta">${e.summary.falta} faltando</span>
        <span class="sobra">${e.summary.sobra} sobrando</span>
        <span class="correto">${e.summary.correto} corretos</span>
      </div>
      <button onclick="abrirHistorico('${e.key}')">Abrir</button>
    </div>
  `).join('');
}

async function abrirHistorico(key){
  try{
    const res = await window.storage.get(key, false);
    const data = JSON.parse(res.value);
    const oleosData = data.oleos || data.items || {};
    state = {date: data.date, items: oleosData, savedKey: key};
    ALL_ITEMS.forEach(i=>{
      if(!state.items[i.code]) state.items[i.code] = DEFAULT_STATE.items[i.code];
    });
    statePecas = {items: data.pecas || {}};
    document.getElementById('data-contagem').value = state.date;
    document.getElementById('save-status').textContent = '';
    render();
    renderInventarios();
    switchTab('contagem');
  }catch(err){
    await customAlert('Não foi possível abrir essa contagem.');
  }
}

async function buscarUltimoSistemaConhecido(){
  try{
    const res = await window.storage.list(HISTORY_PREFIX, false);
    const keys = (res && res.keys) ? res.keys : [];
    if(keys.length===0) return null;
    keys.sort().reverse();
    const r = await window.storage.get(keys[0], false);
    const data = JSON.parse(r.value);
    return data.oleos || data.items || null;
  }catch(err){
    return null;
  }
}

async function init(){
  let loaded = null;
  try{
    const res = await window.storage.get(DRAFT_KEY, false);
    if(res && res.value) loaded = JSON.parse(res.value);
  }catch(err){
    loaded = null;
  }
  if(loaded){
    state = loaded;
    state.savedKey = state.savedKey || null;
    ALL_ITEMS.forEach(i=>{
      if(!state.items[i.code]) state.items[i.code] = DEFAULT_STATE.items[i.code];
    });
  } else {
    state.date = todayStr();
    const ultimoConhecido = await buscarUltimoSistemaConhecido();
    if(ultimoConhecido){
      ALL_ITEMS.forEach(item=>{
        const c = item.code;
        if(ultimoConhecido[c] && typeof ultimoConhecido[c].sistema !== 'undefined'){
          state.items[c].sistema = ultimoConhecido[c].sistema;
        }
      });
    }
  }
  document.getElementById('data-contagem').value = state.date || todayStr();
  render();

  let loadedPecas = null;
  try{
    const resP = await window.storage.get(PECAS_DRAFT_KEY, false);
    if(resP && resP.value) loadedPecas = JSON.parse(resP.value);
  }catch(err){
    loadedPecas = null;
  }
  if(loadedPecas) statePecas = loadedPecas;
  renderInventarios();
}

init();
</script>
